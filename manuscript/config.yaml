rendering:
  # Pandoc emits width= and height= together with keepaspectratio, so the
  # smaller bound wins. At the renderer's 0.50 default the height cap bound
  # the tall landscape plates and shrank their labels to between 3.39 and
  # 4.91 pt, which is unreadable in print and silently broke the figures'
  # shape-and-text accessibility contract. Setting the cap to 1.0 lets width
  # bind for every plate, so a label's printed size follows only from its
  # canvas size and the embed width. Page safety moves from this blunt cap to
  # an explicit gate: tests/test_figure_legibility.py asserts that every plate
  # still prints within 85% of \textheight, leaving room for its caption.
  #
  # The renderer applies front_matter_figure_height_fraction to the *first*
  # figure in the combined document and figure_height_fraction to every later
  # one. The two are held equal here so a plate's printed size does not depend
  # on where it happens to fall in the document; the legibility gate refuses a
  # config in which they differ.
  figure_height_fraction: 1.0
  front_matter_figure_height_fraction: 1.0
render:
  formats:
    pdf: true
    html: true
    slides: false
    docx: false
    epub: false

