name: Ledger gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run python --version && uv run ruff --version && uv run mypy --version && rsvg-convert --version
      - run: uv run python scripts/build_figures.py
      - run: uv run pytest tests/ --cov=src --cov-branch --cov-report=term-missing --cov-report=json:output/coverage.json
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run python scripts/check_registry.py
      - run: uv run python scripts/audit_project.py --report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ledger-python-${{ matrix.python }}
          path: |
            output/coverage.json
            output/reports/white_line_audit.json
