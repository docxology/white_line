name: Ledger gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.1'
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run python --version && uv run ruff --version && uv run mypy --version && rsvg-convert --version
      - run: uv run python scripts/build_figures.py
      - run: uv run pytest tests/ --cov=src --cov-branch --cov-report=term-missing --cov-report=json:output/coverage.json
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run python scripts/check_registry.py
      - run: uv run python scripts/audit_project.py --report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ledger-python-${{ matrix.python }}
          path: |
            output/coverage.json
            output/reports/white_line_audit.json
