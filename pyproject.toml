[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "white_line"
version = "0.9.1"
description = "An absence ledger for unknowns, restraint, and negative space"
authors = [{name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
# Target the declared Python floor, including syntax checks on newer hosts.
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src"]

[tool.ruff.lint]
# Ruff's default set: pyflakes plus the syntax and logic subset of pycodestyle.
# Line length and import ordering are deliberately not enforced; the figure
# plates carry long SVG f-strings that read worse when wrapped.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
